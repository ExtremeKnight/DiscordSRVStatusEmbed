# ExeNovaLink configuration — all-in-one Discord ↔ Minecraft for ExeSMP, by ExeNova.
# Settings from DiscordSRVStatusEmbed are migrated automatically on first start.
config-version: 3

# Channel for the server online/offline status embeds.
channel-id: "1526024733106110524"

embeds:
  info-color: "#5865F2"
  donation-color: "#5865F2"
  stats-color: "#5865F2"
  announcement-color: "#FEE75C"
  report-color: "#ED4245"

server-start:
  enabled: true
  color: "#57F287"
  title: "◆ SERVER ONLINE"
  author:
    name: "☁ Network Status"
    icon-url: "%botavatarurl%"
  description: "**The Minecraft server is now online.**\n\n◆ Status: `ONLINE`\n◆ Access: `OPEN`\n◆ Players: `Welcome!`"
  footer:
    text: "Minecraft Network • Online"
    icon-url: "%botavatarurl%"
  timestamp: true

server-stop:
  enabled: true
  color: "#ED4245"
  title: "◆ SERVER OFFLINE"
  author:
    name: "☁ Network Status"
    icon-url: "%botavatarurl%"
  description: "**The Minecraft server is currently offline.**\n\n◆ Status: `OFFLINE`\n◆ Access: `CLOSED`\n◆ Reason: `Server shutdown`"
  footer:
    text: "Minecraft Network • Offline"
    icon-url: "%botavatarurl%"
  timestamp: true

server-info:
  enabled: true
  prefix: "!"
  java-ip: "de1-free.witchly.host"
  java-port: 40199
  bedrock-enabled: true
  bedrock-ip: "de1-free.witchly.host"
  bedrock-port: 40199
  version: "26.2.0"

commands:
  report:
    enabled: true

security:
  # Applies to legacy ! commands. Slash commands already have Discord rate limits.
  command-cooldown-seconds: 3

discord:
  # ExeNovaLink runs its OWN bot (DiscordSRV is no longer required).
  # 1. https://discord.com/developers/applications -> New Application -> Bot -> Reset Token
  # 2. On the Bot page enable "MESSAGE CONTENT INTENT" and "SERVER MEMBERS INTENT".
  # 3. Invite it with the bot + applications.commands scopes.
  # Tip: the EXENOVA_DISCORD_TOKEN environment variable overrides this value.
  bot-token: "PUT_YOUR_BOT_TOKEN_HERE"
  # Your Discord server ID. Needed for role sync / linking; makes slash
  # commands update instantly instead of up to an hour later.
  guild-id: ""
  invite-url: ""
  intents:
    # Needed for role sync, nickname sync and member lookups. Must also be
    # enabled in the developer portal.
    server-members: true
  # Discord user IDs allowed to use !purge and change the prefix.
  owner-ids: []

moderation:
  # Discord user IDs allowed to use report and suggestion action buttons, and /whois.
  staff-user-ids: []
  # Or: anyone with one of these Discord roles.
  staff-role-ids: []

# Two-way Minecraft <-> Discord chat.
bridge:
  enabled: false
  channel-id: ""
  # Post Minecraft chat through a webhook so each message shows the player's
  # own name and skin (needs Manage Webhooks). Falls back to bot messages.
  use-webhooks: true
  # Supports PlaceholderAPI placeholders, e.g. "%luckperms_prefix%{player}".
  webhook-username: "{player}"
  escape-markdown: true
  ignore-prefix-commands: true
  max-discord-message-length: 256
  formats:
    # Used when webhooks are off/unavailable. {player} {message} + PlaceholderAPI.
    minecraft-to-discord: "**{player}** » {message}"
    # & colour codes allowed. {name} {role} {reply} {message}
    discord-to-minecraft: "&9[Discord] &b{name}&8 » &f{reply}{message}"
    reply-prefix: "&8(reply to {name}) "
  messages:
    join: "**{player}** joined the server"
    first-join-suffix: "for the first time! 🎉"
    quit: "**{player}** left the server"
  events:
    join: true
    quit: true
    death: true
    advancement: true
    server-start: true
    server-stop: true
  # Words replaced with *** in both directions (players with
  # exenova.bridge.bypass-filter skip it for Minecraft -> Discord).
  filtered-words: []
  # Strip Discord invites / all URLs from messages relayed to Discord.
  block-invites: true
  block-links: false

# Optional in-game chat formatter (Adventure MiniMessage). OFF by default so it
# never clashes with EssentialsX chat or another formatter. The format template
# is trusted and fully parsed; the player's own message is inserted literally,
# so players cannot inject click/hover/colour tags unless allow-player-color is
# on and they have exenova.chat.color (even then, only colours - never clicks).
chat:
  formatter:
    enabled: false
    # {player} and {message} (or <player>/<message>). PlaceholderAPI works here.
    default-format: "<gray>{player}</gray> <dark_gray>»</dark_gray> <white>{message}</white>"
    # Per-group formats, chosen by the exenova.chat.group.<key> permission.
    group-formats:
      admin: "<red>[Admin]</red> <white>{player}</white> <dark_gray>»</dark_gray> <white>{message}</white>"
    allow-player-color: false
    block-invites: true
    filtered-words: []

  # Chat channels (/channel <name>). OFF by default. When on, each player talks
  # in one channel at a time; a channel's own format overrides formatter formats.
  # radius > 0 makes a channel local (only players within that many blocks, same
  # world, receive it). discord-channel-id optionally bridges a channel.
  channels:
    enabled: false
    default-channel: global
    channels:
      global:
        aliases: [g]
        format: "<gray>{player}</gray> <dark_gray>»</dark_gray> <white>{message}</white>"
        radius: 0
        permission: ""
        auto-join: true
      local:
        aliases: [l]
        format: "<gray>[L] {player} » {message}</gray>"
        radius: 100
        auto-join: true
      staff:
        aliases: [sc, a]
        format: "<red>[Staff]</red> <white>{player}</white> <dark_gray>»</dark_gray> <red>{message}</red>"
        radius: 0
        permission: exenova.chat.staff
        auto-join: false

# Private messages: /msg, /reply (/r), /ignore, /socialspy. Server-side only.
# {sender} {target} {message} and & colour codes. Players' own colour codes in
# the message body are stripped.
private-messages:
  enabled: true
  sound: true
  format-to: "&7[&fyou &7-> &f{target}&7] &f{message}"
  format-from: "&7[&f{sender} &7-> &fyou&7] &f{message}"
  format-spy: "&8[spy] &7{sender} -> {target}: &8{message}"

# Minecraft <-> Discord account linking (/link in game or in Discord, or DM the bot the code).
linking:
  enabled: true
  storage:
    # sqlite (default, zero setup - stored in plugins/ExeNovaLink/links.db) or mysql.
    # An existing links.yml is imported automatically on first start.
    type: sqlite
    mysql:
      host: localhost
      port: 3306
      database: exenova
      username: ""
      password: ""
      table-prefix: "exenova_"
      pool-size: 6
  # Kick unlinked players with a link code. Never applies while the bot is offline.
  required-to-join: false
  bypass-players: []
  # Role given to everyone who links.
  linked-role-id: ""
  # Role held only while the linked player is online in-game (bot needs Manage Roles,
  # and the role must sit below the bot's top role). Empty = disabled.
  online-role-id: ""
  # Rename linked members in Discord (bot needs Manage Nicknames).
  sync-nicknames: false
  nickname-format: "{player}"
  log-channel-id: ""

# Give Discord roles to linked players based on their Minecraft group.
# Uses LuckPerms if installed, otherwise the group.<name> permission.
role-sync:
  enabled: false
  interval-minutes: 15
  remove-unmatched: true
  groups:
    # minecraft-group: "discord-role-id"
    vip: ""

# Stream the server console to Discord and run commands from it.
console:
  enabled: false
  channel-id: ""
  # Nobody can run commands unless listed here. Keep this channel private!
  allowed-user-ids: []
  allowed-role-ids: []
  blocked-commands: ["op", "deop", "stop", "restart"]
  hide-ip-addresses: true

# Punishment log. Works with any ban plugin (LiteBans, EssentialsX, CMI,
# vanilla...) by watching these commands; AdvancedBan is read from its API.
punishments:
  enabled: false
  channel-id: ""
  watch-commands: [ban, tempban, ipban, banip, tempipban, unban, pardon, mute, tempmute, unmute, kick, warn, jail]

# Vote announcements (NuVotifier / Votifier).
votes:
  channel-id: ""

# Rename channels to show live stats. Discord allows 2 renames per 10 min,
# so the interval is at least 10 minutes. {online} {max} {linked} {status}
channel-stats:
  enabled: false
  interval-minutes: 10
  channels:
    # "voice-channel-id": "👥 Online: {online}/{max}"

# Optional integrations switch on automatically when the plugin is installed.
integrations:
  discordsrv:
    enabled: true
    # Use DiscordSRV's existing account links for players not linked here.
    use-account-links: true
  luckperms:
    enabled: true
  placeholderapi:
    enabled: true
  essentials:
    enabled: true
  floodgate:
    enabled: true
  advancedban:
    enabled: true
  votifier:
    enabled: true

verification:
  enabled: true
  channel-id: "1527525002868555827"
  role-id: "1526031674729693285"
  # Set automatically after the verification panel is created.
  message-id: ""

changelog:
  enabled: true
  channel-id: "1527193381825151169"
  message-id: ""
  # Entries post one at a time, then are remembered as published.
  published-versions: []
  entries:
    - version: "1.0.0"
      changes:
        - "Initial server start and stop status embeds."
    - version: "1.1.0"
      changes:
        - "Added help, aliases, GCash embeds, suggestions, player list, and server commands."
    - version: "1.2.0"
      changes:
        - "Added native statistics, FAQ, staff embeds, announcement relay, and reporting menus."
    - version: "1.3.1"
      changes:
        - "Added /dsreport, configuration, backup, restore, audit, and diagnostics commands."
    - version: "1.4.0"
      changes:
        - "Added player profiles, selectable leaderboards, and richer report context."
    - version: "1.5.0"
      changes:
        - "Added staff notes, watchlists, incident logs, status dashboard, and automatic backups."
    - version: "1.6.0"
      changes:
        - "Added interactive moderation buttons for reports and suggestions."
    - version: "1.6.1"
      changes:
        - "Added dashboard message ownership recovery."
    - version: "1.6.2"
      changes:
        - "Redesigned the server status dashboard."
    - version: "1.6.3"
      changes:
        - "Added Minecraft role verification panel."
    - version: "1.6.4"
      changes:
        - "Added automatic changelog publishing and suggestion discussion prompts."
    - version: "1.7.0"
      changes:
        - "Added config schema versioning, missing-default merging, report-state expiry, quit cleanup, and audit-log rotation."
    - version: "1.8.0"
      changes:
        - "Added runtime suggestion-thread creation when supported by the installed DiscordSRV/JDA API."
    - version: "1.9.0"
      changes:
        - "Added persistent changelog message editing, owner-only purge and prefix commands, and case-insensitive offline player lookup."
    - version: "1.10.0"
      changes:
        - "Added modular configuration, scheduler, storage, dashboard, Discord transport, verification, suggestions, reports, and command-routing services."
        - "Added configurable automation triggers, conditions, cooldowns, and independently registered actions."
    - version: "1.11.0"
      changes:
        - "Connected report submission, suggestion moderation, verification completion, and dashboard refresh events to the automation engine."
        - "Moved report wizard state into a dedicated repository and added safer automation context player handling."
    - version: "1.12.0"
      changes:
        - "Added validated slash-command player options for playtime, seen, and statistics lookups."
        - "Added main-thread offline-player resolution for slash commands with clear unknown-player responses."
    - version: "2.0.0"
      changes:
        - "Renamed to ExeNovaLink with its own Discord bot; DiscordSRV is no longer required."
        - "Added two-way chat bridge with player avatars, account linking, role sync and a Discord console."
        - "Added punishment and vote logs, stats channels, and PlaceholderAPI, LuckPerms, EssentialsX, Geyser and DiscordSRV integrations."
    - version: "2.1.0"
      changes:
        - "Account links are now stored in a database (SQLite by default, MySQL optional); links.yml is migrated automatically."

audit-log:
  enabled: true
  max-bytes: 5000000

watchlist:
  players: []

incident-log:
  enabled: true
  channel-id: "1526033393844752537"

status-dashboard:
  enabled: true
  channel-id: "1527520604813525183"
  interval-minutes: 10
  # Set automatically after the first dashboard message is sent.
  message-id: ""

# Updates the bot's Discord "Playing ..." activity text with the current
# player count on an interval. %online% and %max% are available in the
# template.
bot-presence:
  enabled: true
  interval-minutes: 5
  template: "%online%/%max% players online"

backups:
  auto:
    enabled: true
    interval-hours: 24
    keep: 10

donations:
  gcash-number: "09941718124"
  gcash-qr: "gcash-qr.jpg"
  account-name: "ExeSMPFund"

suggestions:
  channel-id: "1527334516929335356"
  create-thread: true

avatars:
  provider-url: "https://mc-heads.net/avatar/{player}/100"
  # Bedrock (Geyser/Floodgate) players have no Java skin. {player} {uuid}
  bedrock-provider-url: "https://mc-heads.net/avatar/MHF_Steve/100"

faq:
  ip: "de1-free.witchly.host"
  version: "26.2"
  bedrock: "Use port 40199."
  discord: "https://discord.gg/xxxxx"
  store: "https://store.example.com"

staff:
  dcowner:
    - "cinco"
  mcowner:
    - "shan"
  admins:
    - "kent"
    - "shan"
  moderators:
    - ""
    - ""

leaderboards:
  # PLAYTIME, KILLS, DEATHS, MOB_KILLS, or BLOCKS_MINED
  default-type: "PLAYTIME"
  limit: 10

announcements:
  enabled: true
  # Copy the numeric IDs from Discord for #mc-announcements and #mc-chat.
  source-channel-id: "1527357652806533212"
  target-channel-id: "1526024733106110524"
  server-icon-url: ""

reports:
  channel-id: "1527365010454610242"
  request-details: true
  state-timeout-minutes: 30
  discord-instructions: "To report a player, use `/dsreport` in Minecraft or contact the support channel."
  categories:
    - "Cheating / Hacking"
    - "Harassment"
    - "Griefing"
    - "Inappropriate chat"
    - "Other"

log-purge:
  enabled: true
  channel-id: "1526033393844752537"
  interval-minutes: 5
  max-batches-per-run: 5

# Optional configuration-driven automations. Invalid entries are logged and skipped.
automations:
  welcome:
    enabled: false
    trigger:
      type: PLAYER_JOIN
    conditions:
      permission: ""
      first_join: false
    actions:
      - type: DISCORD_EMBED
        channel: welcome
        title: "Player Joined"
        description: "{player} joined the server."
      - type: UPDATE_DASHBOARD

automation-channels:
  # Replace these aliases with numeric Discord channel IDs before enabling automations.
  welcome: ""
