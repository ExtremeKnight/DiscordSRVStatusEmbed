name: ExeNovaLink
version: '${project.version}'
main: com.exenova.link.ExeNovaLink
api-version: '1.21'
description: All-in-one Discord and Minecraft integration for ExeSMP, by ExeNova.
authors: [ExeNova]
# Paper downloads these from Maven Central into this plugin's own classloader
# on first start (keep in sync with pom.xml). Offline hosts: see README.
libraries:
  - net.dv8tion:JDA:5.6.1
  # Patched over JDA's transitive 2.18.3 (security advisories); keep in sync with pom.xml.
  - com.fasterxml.jackson.core:jackson-core:2.18.11
  - com.fasterxml.jackson.core:jackson-databind:2.18.11
  # Account-link storage (HikariCP pulls slf4j-api transitively).
  # The MySQL driver is only loaded at runtime when linking.storage.type: mysql.
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.47.1.0
  - com.mysql:mysql-connector-j:9.1.0
# Everything below is optional: each integration switches on only if that
# plugin is installed. Loading after them lets us hook their APIs on enable.
# Any other plugin's data can be shown through PlaceholderAPI placeholders.
softdepend:
  - DiscordSRV
  - PlaceholderAPI
  - LuckPerms
  - Essentials
  - CMI
  - SuperVanish
  - PremiumVanish
  - Geyser-Spigot
  - floodgate
  - LiteBans
  - AdvancedBan
  - Votifier
commands:
  exenova:
    description: ExeNovaLink admin commands
    usage: /exenova <reload|status|diagnostics|config|backup|restore|integrations>
    aliases: [exn, exenovalink]
  link:
    description: Link your Minecraft account to Discord
    usage: /link [code]
    aliases: [discordlink]
    permission: exenova.link
  unlink:
    description: Unlink your Minecraft account from Discord
    usage: /unlink
    aliases: [discordunlink]
    permission: exenova.link
  channel:
    description: Switch or list chat channels
    usage: /channel [name|list]
    aliases: [ch]
    permission: exenova.chat.channel
  discord:
    description: Show the Discord invite and your link status
    usage: /discord
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [m, tell, w, whisper, pm]
    permission: exenova.msg
  reply:
    description: Reply to your last private message
    usage: /reply <message>
    aliases: [r]
    permission: exenova.msg
  ignore:
    description: Toggle ignoring a player's private messages
    usage: /ignore <player>
    permission: exenova.msg
  socialspy:
    description: Watch other players' private messages
    usage: /socialspy
    aliases: [spy]
    permission: exenova.socialspy
  dsreport:
    description: Open the player reporting menu
    usage: /dsreport [player]
    aliases: [exreport]
  dsnote:
    description: Manage private staff notes for a player
    usage: /dsnote <add|list|clear> <player> [note]
    aliases: [exnote]
  dswatch:
    description: Manage the watchlist
    usage: /dswatch <add|remove|list> [player]
    aliases: [exwatch]
  # Legacy command names from DiscordSRVStatusEmbed, kept so existing habits,
  # scripts and command blocks keep working. They map onto /exenova.
  discordstatusreload:
    description: Legacy alias of /exenova reload
    usage: /discordstatusreload
  discordstatusdiagnostics:
    description: Legacy alias of /exenova diagnostics
    usage: /discordstatusdiagnostics
    aliases: [dsdiag]
  discordstatusconfig:
    description: Legacy alias of /exenova config
    usage: /discordstatusconfig
    aliases: [dscfg]
  discordstatusbackup:
    description: Legacy alias of /exenova backup
    usage: /discordstatusbackup
    aliases: [dsbackup]
  discordstatusrestore:
    description: Legacy alias of /exenova restore
    usage: /discordstatusrestore <backup-file.yml>
    aliases: [dsrestore]
permissions:
  exenova.*:
    description: All ExeNovaLink permissions
    default: op
    children:
      exenova.reload: true
      exenova.config: true
      exenova.notes: true
      exenova.watchlist: true
      exenova.reports.notify: true
      exenova.link: true
      exenova.bridge.bypass-filter: true
  exenova.reload:
    description: Reload ExeNovaLink
    default: op
  exenova.config:
    description: Configuration menu, diagnostics, backup and restore
    default: op
  exenova.notes:
    description: Manage staff notes
    default: op
  exenova.watchlist:
    description: Manage the watchlist and receive its alerts
    default: op
  exenova.reports.notify:
    description: Receive in-game report notifications
    default: op
  exenova.link:
    description: Link a Minecraft account to Discord
    default: true
  exenova.bridge.bypass-filter:
    description: Chat sent to Discord skips the word filter
    default: op
  exenova.msg:
    description: Use private messages (/msg, /reply, /ignore)
    default: true
  exenova.socialspy:
    description: Watch other players' private messages
    default: op
  exenova.chat.color:
    description: Use colour codes in your own chat messages (when the formatter allows it)
    default: op
  exenova.chat.emoji:
    description: Use :emoji: shortcuts in chat
    default: true
  exenova.chat.channel:
    description: Use chat channels
    default: true
  exenova.chat.staff:
    description: Access the staff chat channel
    default: op
  # Old permission nodes still grant the same access (checked alongside exenova.*).
  discordstatus.reload:
    default: op
  discordstatus.config:
    default: op
  discordstatus.notes:
    default: op
  discordstatus.watchlist:
    default: op
  discordstatus.reports.notify:
    default: op
